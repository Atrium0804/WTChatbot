        route: inhoudelijk
        intake: {intentie: lookup, geboortejaar: 2015, discipline: weg}

  # --- #102 Spec 1: vervolgvraag met een onbekende categorie ---
  - id: categorie-vervolg-onbekende-u99
    herkomst: "#102 Spec, bevinding 1"
    beurten:
      - {vraag: "Welke categorie voor jongen geboren in 2015 op de weg?", route: bypass}
