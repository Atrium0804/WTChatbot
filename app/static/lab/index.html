<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wielie Lab</title>
<!-- Diagnose #54: in de geinstalleerde PWA vervaagt iOS de bovenste ~36 css-px onder
     de statusbalk. Proef: pagina onder de statusbalk tekenen met een blauwe kop. -->
<link rel="manifest" href="/lab/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#033ec2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wielie Lab">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header {
    background: #033ec2;
    color: #fff;
    padding: 0.6rem 1rem;
    padding-top: calc(0.6rem + env(safe-area-inset-top, 0px));
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  .label { font: 12px monospace; color: #555; padding: 0.4rem 1rem 0; }
  .s { padding: 0.6rem 1rem; margin: 0; font-size: 1.05rem; font-weight: 600; background: #033ec2; color: #fff; }
  #m { font: 12px monospace; padding: 0.6rem 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>WTC - Wielie The Chatbot</h1>
  <div>Vragen over KNWU-zaken, regio Midden en WTC Woerden</div>
</header>
<div class="label">Ter vergelijking, ruim onder de zone:</div>
<h1 class="s">WTC - Wielie The Chatbot</h1>
<pre id="m"></pre>
<script>
  (function () {
    // Liniaal vanaf de echte bovenrand van het scherm: streep elke 4 css-px, getal elke 20.
    var ruler = document.createElement("div");
    ruler.style.cssText = "position:absolute;top:0;left:0;right:0;pointer-events:none;";
    for (var y = 0; y <= 160; y += 4) {
      var tick = document.createElement("div");
      tick.textContent = y % 20 === 0 ? y : "";
      tick.style.cssText = "position:absolute;right:4px;top:" + y + "px;font:10px monospace;" +
        "color:#c00;border-top:1px solid #c00;width:" + (y % 20 === 0 ? 40 : 16) + "px;text-align:right;";
      ruler.appendChild(tick);
    }
    document.body.appendChild(ruler);
  })();
  (function () {
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);";
    document.body.appendChild(probe);
    var safeTop = getComputedStyle(probe).paddingTop;
    probe.remove();
    var h1 = document.querySelector("header h1").getBoundingClientRect();
    var v = window.visualViewport;
    document.getElementById("m").textContent = [
      "versie: lab-diag-3",
      "standalone: " + (navigator.standalone === true),
      "safe-area-inset-top: " + safeTop,
      "kop-tekst: " + Math.round(h1.top) + " tot " + Math.round(h1.bottom) + " px",
      "screen: " + screen.width + " x " + screen.height,
      "inner: " + window.innerWidth + " x " + window.innerHeight,
      "visualViewport: " + (v ? v.width + " x " + v.height + " @ " + v.scale : "n.v.t.")
    ].join("\n");
  })();
</script>
</body>
</html>
