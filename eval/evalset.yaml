# Eval-set: launch-gate van de MVP (>= 90% correct met correcte bron,
# re-run na elke library-update). Spec: docs/reference/eval-set.md.
# Wayfinder-ticket #13 (map #2).
#
# Schema per entry:
#   id:                unieke code (bijv. knwu-verzet-u15)
#   categorie:         knwu | regio | club
#   type:              standaard | websearch | strikethrough | verheldering
#   vraag:             typische clubvraag
#   verwacht_antwoord: korte kernfeiten, gescheiden door ";" — elk token moet
#                      in het B2-antwoord staan (getallen/korte woorden heel,
#                      langere woorden als woordbegin; zie run_eval.py)
#   bron:              Verwachte bron (documentnaam zonder extensie of URL),
#                      alternatieven gescheiden door " | " — moet in een
#                      "Bron:"-regel van het antwoord staan
#   versiedatum:       Verwachte versie/datum van de bron
#   doorhaal_waarde:   (alleen type=strikethrough) de superseded waarde uit
#                      de rode revisie — mag NIET in het antwoord voorkomen
#   (type=verheldering: vage vraag, de bot moet een wedervraag stellen;
#    geen bron-check, bron/versiedatum optioneel)
#
# Verdeling: 13 knwu / 5 regio / 5 club (23 vragen). Harde 100%-gate op type
# strikethrough (min. 3) en websearch (min. 2, licentie/verzekering);
# verheldering telt mee voor de >=90%-gate maar heeft geen bron-check.
# Oorspronkelijk een door de agent gegenereerd voorstel (wayfinder-ticket #13,
# Q7); na eval run 3 handmatig gecontroleerd tegen PDF en live bronnen (#28).

evalset:
  # --- KNWU (10) ---
