  - id: verzet-u11-baan-en-weg
    herkomst: "#102 Spec, bevinding 2"
    beurten:
      - {vraag: "Welk verzet voor U11 op de baan en de weg?", route: inhoudelijk}

  - id: verzet-u11-baan-en-weg-intake
    herkomst: "#102 Spec, bevinding 2"
