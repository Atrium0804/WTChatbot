  # --- #102 Spec 4: vertaling oude en nieuwe categorienamen ---
  - id: vertaling-oude-cat-3
    herkomst: "#102 Spec, bevinding 4"
    beurten:
      - {vraag: "oude cat. 3", route: bypass}

  - id: vertaling-oude-cat-3-na-seizoenwissel
    herkomst: "#102 Spec, bevinding 4"
    vandaag: 2026-07-01
    beurten:
      - {vraag: "oude cat. 3", route: bypass}

  - id: vertaling-mu12-vu13
    herkomst: "#102 Spec, bevinding 4"
    beurten:
