<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wielie Lab V3</title>
<!-- Diagnose #54 (lab-diag-6): welke paginaeigenschap brengt de wazige rand terug zonder theme-color? -->
<link rel="manifest" href="/lab/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wielie Lab">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; }
  header { background:#fff;color:#000; padding: 0.6rem 1rem; padding-top: calc(0.6rem + env(safe-area-inset-top, 0px)); }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  nav { padding: 1rem; font-size: 1.2rem; }
  nav a { padding: 0.3rem; }
  #m { font: 12px monospace; padding: 0.6rem 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>WTC - Wielie The Chatbot</h1>
  <div>V3: wit bovenaan, met viewport-fit=cover</div>
</header>
<nav><a href="/lab/index.html">V1</a> | <a href="/lab/v2.html">V2</a> | <a href="/lab/v3.html">V3</a> | <a href="/lab/v4.html">V4</a></nav>
<pre id="m"></pre>
<script>
  (function () {
    var ruler = document.createElement("div");
    ruler.style.cssText = "position:absolute;top:0;left:0;right:0;pointer-events:none;";
    for (var y = 0; y <= 120; y += 4) {
      var tick = document.createElement("div");
      tick.textContent = y % 20 === 0 ? y : "";
      tick.style.cssText = "position:absolute;right:4px;top:" + y + "px;font:10px monospace;" +
        "color:#c00;border-top:1px solid #c00;width:" + (y % 20 === 0 ? 40 : 16) + "px;text-align:right;";
      ruler.appendChild(tick);
    }
    document.body.appendChild(ruler);
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);";
    document.body.appendChild(probe);
    var safeTop = getComputedStyle(probe).paddingTop;
    probe.remove();
    document.getElementById("m").textContent = [
      "versie: lab-diag-6 V3",
      "standalone: " + (navigator.standalone === true),
      "safe-area-inset-top: " + safeTop,
      "inner: " + window.innerWidth + " x " + window.innerHeight,
      "screen: " + screen.width + " x " + screen.height
    ].join("\n");
  })();
</script>
</body>
</html>
