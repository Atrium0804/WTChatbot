# Eval-set: launch-gate van de MVP (>= 90% correct met correcte bron,
# re-run na elke library-update). Spec: docs/reference/eval-set.md.
# Wayfinder-ticket #13 (map #2).
#
# Schema per entry:
#   id:                unieke code (bijv. knwu-verzet-u15)
#   categorie:         knwu | regio | club
#   type:              standaard | websearch | strikethrough | verheldering
#   taalniveau:        (optioneel) B1 (default) | B2 — het taalniveau dat de
#                      runner in de contextregel injecteert (issue #52). Bij B2
#                      moet het antwoord een "Bron:"-regel bevatten die matcht
#                      met `bron`; bij B1 mag het antwoord géén Bron-regel bevatten.
#   vraag:             typische clubvraag
#   verwacht_antwoord: korte kernfeiten, gescheiden door ";" — elk token moet
#                      in het antwoord staan (getallen/korte woorden heel,
#                      langere woorden als woordbegin; zie run_eval.py)
#   bron:              Verwachte bron (documentnaam zonder extensie of URL),
#                      alternatieven gescheiden door " | " — bij taalniveau B2
#                      moet die in een "Bron:"-regel van het antwoord staan
#   versiedatum:       Verwachte versie/datum van de bron
#   doorhaal_waarde:   (alleen type=strikethrough) de superseded waarde uit
#                      de rode revisie — mag NIET in het antwoord voorkomen
#   niet_in_antwoord:  (optioneel) woorden gescheiden door ";" die NIET in het
#                      antwoord mogen staan (bv. een routeringsvraag of
#                      overbodige verheldervragen)
#   via:               (optioneel, alleen "router") vraag end-to-end via de
#                      router-agent in plaats van de categorie-agent
#   beurten:           (optioneel) lijst eerdere gebruikersberichten in
#                      dezelfde conversatie, vóór `vraag`; alleen het
#                      antwoord op `vraag` wordt gecheckt
#   verwachte_agent:   (optioneel) agent die `vraag` moet beantwoorden
#                      (router-agent | knwu-agent | regio-agent | club-agent)
#   (type=verheldering: vage vraag, de bot moet een wedervraag stellen;
#    geen bron-check, bron/versiedatum optioneel)
#
# Verdeling: 18 knwu / 5 regio / 5 club (28 vragen, 4 via de router) + 4 extra
# B1-vragen onderaan (taalniveau B1, zonder bron-check). Harde 100%-gate op type
# strikethrough (min. 3) en websearch (min. 2, licentie/verzekering);
# verheldering telt mee voor de >=90%-gate maar heeft geen bron-check.
# Oorspronkelijk een door de agent gegenereerd voorstel (wayfinder-ticket #13,
# Q7); na eval run 3 handmatig gecontroleerd tegen PDF en live bronnen (#28).

evalset:
  # --- KNWU (10) ---
  - id: knwu-licentie-pakketten
    taalniveau: B2
    categorie: knwu
    type: websearch
    vraag: "Welke licentiepakketten kent de KNWU voor jeugd in 2026 en wat kost elk pakket?"
