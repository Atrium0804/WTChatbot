# Eval-set: launch-gate van de MVP (>= 90% correct met correcte bron,
# re-run na elke library-update). Spec: docs/reference/eval-set.md.
# Wayfinder-ticket #13 (map #2).
#
# Schema per entry:
#   id:                unieke code (bijv. knwu-verzet-u15)
#   categorie:         knwu | regio | club
#   type:              standaard | websearch | strikethrough
#   vraag:             typische clubvraag
#   verwacht_antwoord: kernfeiten, gescheiden door ";" — moeten ALLEMAAL in
#                      het B2-antwoord voorkomen (case-insensitive, komma-
#                      en puntnotatie genormaliseerd)
#   bron:              Verwachte bron (documentnaam of URL) — moet in de
#                      "Bron:"-regel van het antwoord staan
#   versiedatum:       Verwachte versie/datum van de bron
#   doorhaal_waarde:   (alleen type=strrikethrough) de superseded waarde uit
#                      de rode revisie — mag NIET in het antwoord voorkomen
#
# Verdeling: 10 knwu / 5 regio / 5 club. Harde 100%-gate op type
# strikethrough (min. 3) en websearch (min. 2, licentie/verzekering).
# Dit is een door de agent gegenereerd voorstel; de beheerder reviewt en
# corrigeert (wayfinder-ticket #13, Q7).

evalset:
  # --- KNWU (10) ---
  - id: knwu-licentie-pakketten
    categorie: knwu
    type: websearch
    vraag: "Welke licentiepakketten kent de KNWU voor jeugd in 2026 en wat kost elk pakket?"
    verwacht_antwoord: "Basis; Plus; Premium; startrecht zit in de licentie zelf; pakketten verschillen in buitenlandstartrecht en verzekeringsdekking"
    bron: "kenniscentrum.knwu.nl/knwu-licenties"
    versiedatum: "2026"
  - id: knwu-verzekering-dekking
    categorie: knwu
    type: websearch
    vraag: "Wat is er verzekerd bij een Basis-licentie versus een Premium-licentie?"
    verwacht_antwoord: "dekking; wettelijke aansprakelijkheid; verschil Basis vs Premium; sectie Verzekeringen Kenniscentrum"
    bron: "kenniscentrum.knwu.nl Verzekeringen"
    versiedatum: "2026"
  - id: knwu-verzet-u15
    categorie: knwu
    type: strikethrough
    vraag: "Wat is het maximaal toegestane verzet voor jongens U15 bij wegwielrennen?"
    verwacht_antwoord: "6,70 meter; U15; artikel 20.1.007"
    bron: "TITEL_20-Jeugdwielrennen_20260921.pdf"
    versiedatum: "2026-09-21"
    doorhaal_waarde: "6,55"
  - id: knwu-verzet-u11
    categorie: knwu
    type: strikethrough
    vraag: "Wat is het maximaal toegestane verzet voor jongens U11 bij wegwielrennen?"
    verwacht_antwoord: "5,90 meter; U11; artikel 20.1.007"
    bron: "TITEL_20-Jeugdwielrennen_20260921.pdf"
    versiedatum: "2026-09-21"
    doorhaal_waarde: "5,78"
  - id: knwu-verzet-u17
    categorie: knwu
    type: strikethrough
    vraag: "Welk maximaal verzet geldt voor U17 (nieuwelingen) bij wegwielrennen?"
    verwacht_antwoord: "7,68 meter; U17 nieuwelingen; artikel 20.1.007"
    bron: "TITEL_20-Jeugdwielrennen_20260921.pdf"
    versiedatum: "2026-09-21"
    doorhaal_waarde: "7,01"
  - id: knwu-inschrijfgeld-jeugd
    categorie: knwu
    type: strikethrough
    vraag: "Wat zijn de geadviseerde inschrijfgelden voor jeugd- en nieuwelingenwedstrijden en wat geldt bij bijschrijven?"
    verwacht_antwoord: "adviserend schema Nationale Besluiten; bijschrijven binnen 120 uur voor aanvang maximaal 10,00 euro; boete 30,00 euro bij niet-afmelden"
    bron: "Nationale_Besluiten_20260918.pdf"
    versiedatum: "2026-09-18"
  - id: knwu-nk-dispensatie-u10
    categorie: knwu
    type: strikethrough
    vraag: "Mag een renner van categorie U10 die dispensatie heeft om in een categorie lager te rijden, meedoen aan het NK?"
    verwacht_antwoord: "nee; dispensatie in een lagere categorie sluit deelname aan het NK uit; U6 t/m U8 kunnen sowieso geen dispensatie voor het NK krijgen"
    bron: "TITEL_20-Jeugdwielrennen_20260921.pdf"
    versiedatum: "2026-09-21"
  - id: knwu-actuele-versie-titel20
    categorie: knwu
    type: standaard
    vraag: "Welke versie van Titel 20 Jeugdwielrennen is leidend en waar controleer ik dat?"
    verwacht_antwoord: "versie 21-09-2026; Kenniscentrum is autoriteit voor de nieuwste versie"
    bron: "kenniscentrum.knwu.nl/regelgeving"
    versiedatum: "2026-09-21"
  - id: knwu-wijziging-nationale-besluiten
    categorie: knwu
    type: standaard
    vraag: "Wat is er gewijzigd in de Nationale Besluiten 2026 ten opzichte van de vorige versie?"
    verwacht_antwoord: "wijzigingsmemo op het Kenniscentrum; bronvolgorde memo dan rode revisies"
    bron: "kenniscentrum.knwu.nl/regelgeving"
    versiedatum: "2026-09-18"
  - id: knwu-contact
    categorie: knwu
    type: standaard
    vraag: "Hoe kan ik de KNWU bereiken als ik conflicterende informatie tegenkom?"
    verwacht_antwoord: "085-070 19 00; dinsdag t/m vrijdag 08:30-12:00"
    bron: "kenniscentrum.knwu.nl"
    versiedatum: "2026"

