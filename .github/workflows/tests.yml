name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
            app/requirements-dev.txt
      - run: pip install -r requirements.txt -r app/requirements-dev.txt
      - run: python -m pytest app/tests tests -m "not browser"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
            app/requirements-dev.txt
      - run: pip install -r requirements.txt -r app/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest app/tests -m browser

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test "app/tests/*.cjs"

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
            app/requirements-dev.txt
      - run: pip install -r requirements.txt -r app/requirements-dev.txt
      - run: pyright --pythonpath "$(which python)"
