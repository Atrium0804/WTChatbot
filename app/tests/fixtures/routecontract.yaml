      - {vraag: "Welk verzet voor U11 op de baan?", route: inhoudelijk}

  - id: verzet-u11-baan-intake
    herkomst: "#102 Spec, bevinding 2"
    beurten:
      - vraag: "Welk verzet voor U11 op de baan?"
        route: inhoudelijk
