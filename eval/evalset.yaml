# Eval-set: launch-gate van de MVP (>= 90% correct met correcte bron,
# re-run na elke library-update). Spec: docs/reference/eval-set.md.
# Wayfinder-ticket #13 (map #2).
#
# Schema per entry:
#   id:                unieke code (bijv. knwu-verzet-u15)
#   categorie:         knwu | regio | club
#   type:              standaard | websearch | strikethrough | verheldering
#   taalniveau:        (optioneel) B1 (default) | B2 — het taalniveau dat de
#                      runner in de contextregel injecteert (issue #52). Bij B2
#                      moet het antwoord een "Bron:"-regel bevatten die matcht
#                      met `bron`; bij B1 mag het antwoord géén Bron-regel bevatten.
#   vraag:             typische clubvraag
#   verwacht_antwoord: korte kernfeiten, gescheiden door ";" — elk token moet
#                      in het antwoord staan (getallen/korte woorden heel,
#                      langere woorden als woordbegin; zie run_eval.py)
#   bron:              Verwachte bron (documentnaam zonder extensie of URL),
#                      alternatieven gescheiden door " | " — bij taalniveau B2
#                      moet die in een "Bron:"-regel van het antwoord staan
#   versiedatum:       Verwachte versie/datum van de bron
#   doorhaal_waarde:   (alleen type=strikethrough) de superseded waarde uit
#                      de rode revisie — mag NIET in het antwoord voorkomen
#   verwacht_marker:   (optioneel, #47) bv. "[BRONCONFLICT]" — moet in de RUWE
#                      agent-output staan (de proxy stript de marker voor de
#                      gebruiker); checkt los van de kernfeiten
#   niet_in_antwoord:  (optioneel) woorden gescheiden door ";" die NIET in het
#                      antwoord mogen staan (bv. een routeringsvraag of
#                      overbodige verheldervragen)
#   via:               (optioneel, alleen "router") vraag end-to-end via de
#                      router-agent in plaats van de categorie-agent
#   beurten:           (optioneel) lijst eerdere gebruikersberichten in
#                      dezelfde conversatie, vóór `vraag`; alleen het
#                      antwoord op `vraag` wordt gecheckt
#   verwachte_agent:   (optioneel) agent die `vraag` moet beantwoorden
#                      (router-agent | knwu-agent | regio-agent | club-agent)
#   (type=verheldering: vage vraag, de bot moet een wedervraag stellen;
#    geen bron-check, bron/versiedatum optioneel)
#
# Verdeling: 16 knwu / 5 regio / 6 club (27 vragen; 5 via de router, 4 met
# taalniveau B1). Harde 100%-gate op type strikethrough (min. 3) en websearch
# (min. 2, licentie/verzekering);
# verheldering telt mee voor de >=90%-gate maar heeft geen bron-check.
# Oorspronkelijk een door de agent gegenereerd voorstel (wayfinder-ticket #13,
# Q7); na eval run 3 handmatig gecontroleerd tegen PDF en live bronnen (#28).
# Review 2026-11-13: set ingekrompen van 35 naar 27 vragen. Verwijderd als
# dubbel/overlappend: knwu-verzet-u11 (derde verzet-vraag, zelfde artikel 20.1.007),
# knwu-b1-verzet-u15 (B1-twin van knwu-verzet-u15), knwu-categorie-meisje-2015
# (derde vraag die 2015 -> U12 oplost), knwu-verheldering-leeftijdscategorie
# (directe twin van de router-variant), knwu-wijziging-nationale-besluiten
# (overlapt knwu-actuele-versie-titel20), knwu-nk-weg-jeugd-kwalificatie
# (overlapt regio-nk-kwalificatie en wisselde per run), regio-mnc-veldrijden-
# starttijden en club-zmc-kosten (B2-twins van de B1-varianten; B1 is sinds
# issue #52 de productiestandaard). Strikethrough staat nu op het minimum van 3.

evalset:
  # --- KNWU ---
  - id: knwu-licentie-pakketten
    taalniveau: B2
    categorie: knwu
    type: websearch
    vraag: "Welke licentiepakketten kent de KNWU voor jeugd in 2026 en wat kost elk pakket?"
    # review 2026-11-12: "startrecht" was een false negative — een goed antwoord
    # noemt welke wedstrijden per pakket mogen ("wedstrijden"), niet het woord "startrecht"
    verwacht_antwoord: "Basis; Plus; Premium; 26; 72; 135; wedstrijden; internationa; verzeker"
    bron: "kenniscentrum.knwu.nl/knwu-licenties"
    versiedatum: "2026"
  - id: knwu-licentie-u13-geen-pakketten
    taalniveau: B2
    categorie: knwu
    type: websearch
    vraag: "Welke licentie en welk licentiepakket heeft mijn dochter nodig? Ze is geboren in 2016."
    # De KNWU Licentie U13 kent één variant (€26); de pakketprijzen van U17 (72/135) horen er niet bij
    verwacht_antwoord: "KNWU Licentie U13; 26"
    niet_in_antwoord: "72; 135"
    bron: "kenniscentrum.knwu.nl/knwu-licenties/jeugd-u13 | TITEL_20-Jeugdwielrennen_20260921"
    versiedatum: "2026"
  - id: knwu-verzekering-dekking
    taalniveau: B2
    categorie: knwu
    type: websearch
    vraag: "Wat is er verzekerd bij een Basis-licentie versus een Premium-licentie?"
    verwacht_antwoord: "aansprakelijk; Basis; Premium; wereldwijd"
    bron: "kenniscentrum.knwu.nl/verzekeringen"
    versiedatum: "2026"
  - id: knwu-verzet-u15
    taalniveau: B2
    categorie: knwu
    type: strikethrough
    vraag: "Wat is het maximaal toegestane verzet voor jongens U15 bij wegwielrennen?"
    verwacht_antwoord: "6,70; U15; artikel 20.1.007"
    bron: "TITEL_20-Jeugdwielrennen_20260921"
    versiedatum: "2026-09-21"
    doorhaal_waarde: "6,55"
  - id: knwu-verzet-u17
    taalniveau: B2
    categorie: knwu
    type: strikethrough
    vraag: "Welk maximaal verzet geldt voor U17 (nieuwelingen) bij wegwielrennen?"
    verwacht_antwoord: "7,68; U17; nieuwelingen; artikel 20.1.007"
    bron: "TITEL_20-Jeugdwielrennen_20260921"
    versiedatum: "2026-09-21"
    doorhaal_waarde: "7,01"
  - id: knwu-inschrijfgeld-jeugd
    taalniveau: B2
    categorie: knwu
    type: standaard
    vraag: "Wat zijn de geadviseerde inschrijfgelden voor jeugd- en nieuwelingenwedstrijden en wat geldt bij bijschrijven?"
    verwacht_antwoord: "nihil; 3,50; 120 uur; 10"
    bron: "Nationale_Besluiten_20260918"
    versiedatum: "2026-09-18"
  - id: knwu-nk-dispensatie-u10
    taalniveau: B2
    categorie: knwu
    type: strikethrough
    vraag: "Mag een renner van categorie U10 die dispensatie heeft om in een categorie lager te rijden, meedoen aan het NK?"
    verwacht_antwoord: "ja; categorie waarvoor; U6 t/m U8; BMX"
    bron: "TITEL_20-Jeugdwielrennen_20260921"
    versiedatum: "2026-09-21"
    doorhaal_waarde: "niet kwalificeren"
  - id: knwu-actuele-versie-titel20
    taalniveau: B2
    categorie: knwu
    type: standaard
    vraag: "Welke versie van Titel 20 Jeugdwielrennen is leidend en waar controleer ik dat?"
    verwacht_antwoord: "21-09-2026; kenniscentrum; leidend"
    bron: "kenniscentrum.knwu.nl/regelgeving"
    versiedatum: "2026-09-21"
  - id: knwu-bronconflict-u17-nieuweling
    taalniveau: B2
    categorie: knwu
    type: websearch
    vraag: "In welke leeftijdscategorie rijdt een renner die in 2026 15 jaar wordt met een KNWU Licentie U17?"
    # Titel 20 (art. 20.0.004) noemt 15 en 16 jaar "U17 Nieuweling"; de
    # Kenniscentrum-pagina voor de U17-licentie noemt U16 en U17 (#47).
    # Het antwoord moet de Titel 20-waarde noemen én eindigen op een
    # [BRONCONFLICT]-markerregel (zit in de ruwe agent-output).
    verwacht_antwoord: "U17; nieuweling"
    verwacht_marker: "[BRONCONFLICT]"
    bron: "TITEL_20-Jeugdwielrennen_20260921 | kenniscentrum.knwu.nl/knwu-licenties"
    versiedatum: "2026-09-21"
  - id: knwu-contact
    taalniveau: B2
    categorie: knwu
    type: standaard
    vraag: "Hoe kan ik de KNWU bereiken als ik conflicterende informatie tegenkom?"
    verwacht_antwoord: "070; 1900; dinsdag; vrijdag; 8:30; 12:00"
    bron: "knwu.nl/contact"
    versiedatum: "2026"
  - id: knwu-categorie-jongen-2013
    taalniveau: B2
    categorie: knwu
    type: standaard
    vraag: "In welke leeftijdscategorie rijdt een jongen geboren in 2013 bij wegwielrennen in 2026?"
    verwacht_antwoord: "U14; 2013; artikel 20.0.004"
    bron: "TITEL_20-Jeugdwielrennen_20260921"
    versiedatum: "2026-09-21"
  - id: knwu-verheldering-licentie-via-router
    taalniveau: B2
    categorie: knwu
    type: verheldering
    via: router
    vraag: "Welke licentie moet ik aanvragen voor mijn zoon?"
    # alleen het geboortejaar bepaalt de licentie (Titel 20 art. 20.0.002);
    # geen routeringsvraag en geen vragen naar discipline of geslacht (#38)
    verwacht_antwoord: "geboortejaar"
    niet_in_antwoord: "MNC; Hans van den Hengel; WTC Woerden; discipline; geslacht"
  - id: knwu-verheldering-categorie-via-router
    taalniveau: B1
    categorie: knwu
    type: verheldering
    via: router
    vraag: "In welke categorie rijdt mijn zoon?"
    # feedback: met contextregels kondigde de router de handoff alleen in
    # tekst aan ("Ik geef je door naar de juiste agent") en deed hem niet;
    # de knwu-agent moet zelf naar het geboortejaar vragen
    verwacht_antwoord: "geboortejaar"
    niet_in_antwoord: "agent; geslacht"
    verwachte_agent: knwu-agent
  # --- KNWU via de router, met vervolgvragen (#44) ---
  # Meten of een conversatie na een handoff bij de juiste agent uitkomt
  # ("sticky handoff"), op basis van geanonimiseerde feedback.
  # knwu-router-verzet-na-regiovraag verwijderd (review 2026-11-12): dubbel met
  # de andere verzet-vragen; er zijn voldoende verzet-vragen in de set
  - id: knwu-router-geboortejaar-als-vervolg
    taalniveau: B2
    categorie: knwu
    type: standaard
    via: router
    beurten:
      - "In welke leeftijdscategorie rijdt mijn zoon?"
    vraag: "2015"
    verwacht_antwoord: "U12; 2015"
    # geen informatie over een andere leeftijdscategorie (feedback: "nieuwelingen")
    niet_in_antwoord: "Nieuweling"
    bron: "TITEL_20-Jeugdwielrennen_20260921"
    versiedatum: "2026-09-21"
    verwachte_agent: knwu-agent
  - id: knwu-router-licentie-na-clubvraag
    taalniveau: B2
    categorie: knwu
    type: standaard
    via: router
    beurten:
      - "Wat kost de contributie voor jeugdleden bij WTC Woerden?"
    vraag: "Welke licentie heeft mijn zoon nodig? Hij is geboren in 2012."
    # 14 jaar in 2026: leeftijdscategorie U15, licentie U17 (13 t/m 16 jaar, art. 20.0.002)
    verwacht_antwoord: "KNWU Licentie U17; U15"
    bron: "TITEL_20-Jeugdwielrennen_20260921 | kenniscentrum.knwu.nl"
    versiedatum: "2026-09-21"
    verwachte_agent: knwu-agent
  # --- Club via de router: algemene vraag zonder KNWU-/regio-trefwoorden ---
  # De router moet direct handoff doen naar de club-agent, zonder
  # routeringsvraag: de Club-library bevat ook de algemene Website-teksten
  # van de jeugdsite (bv. "Een fiets en pedalen uitzoeken")
  - id: club-router-fiets-kopen
    taalniveau: B2
    categorie: club
    type: standaard
    via: router
    vraag: "Waar moet ik op letten bij het kopen van een fiets voor mijn kind?"
    verwacht_antwoord: "veldfiets; racefiets; klikpedalen"
    niet_in_antwoord: "KNWU-regels; regiowedstrijd; MNC"
    bron: "Een fiets en pedalen uitzoeken"
    versiedatum: "1.7"
    verwachte_agent: club-agent

  # --- Regio Midden ---
